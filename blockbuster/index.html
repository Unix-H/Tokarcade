<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Block Buster</title>
  <meta name="description" content="Drag blocks onto the grid, fill rows and columns, chain combos.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='11' height='11' rx='2' fill='%23ff3347'/%3E%3Crect x='13' width='11' height='11' rx='2' fill='%23ffd01f'/%3E%3Crect y='13' width='11' height='11' rx='2' fill='%2325c9ff'/%3E%3Crect x='13' y='13' width='11' height='11' rx='2' fill='%2338d94a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" role="img" aria-label="Block Buster board. Drag the three blocks at the bottom onto the grid."></canvas>

  <header class="hud" id="hud">
    <div class="side"><a class="lnk" href="../index.html">← Tokarcade</a></div>
    <div class="points">
      <div class="score" id="score" aria-label="Score">0</div>
      <span class="best" id="best-wrap"><svg viewBox="0 0 24 18" aria-hidden="true"><path d="M1 4l6 5 5-8 5 8 6-5-2.5 13h-17z" fill="currentColor"/></svg><b id="best" aria-label="Best score">0</b></span>
      <span class="combo" id="combo"></span>
    </div>
    <div class="side r"><button class="lnk" id="sound" type="button"></button><button class="lnk" id="restart" type="button">Restart</button></div>
  </header>

  <div class="edge" id="edge" aria-hidden="true"></div>
  <div class="shout" id="shout" aria-hidden="true"></div>
  <div class="sr" id="live" role="status"></div>

  <section class="over" id="over" role="dialog" aria-modal="true" aria-labelledby="over-t" hidden>
    <h1 id="over-t">No space left</h1>
    <p class="big" id="over-score">0</p>
    <p class="note" id="over-note"></p>
    <button class="again" id="again" type="button">Play again</button>
  </section>

  <noscript>This game needs JavaScript.</noscript>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
